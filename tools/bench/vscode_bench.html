<!doctype html>
<!--
  tools/bench/vscode_bench.py's page: VS Code's chat tab (vscode/dev/chat.html,
  the harness) in a frame, given the made-up chats' conversations as pane.py
  reads them, and timed. What it measured goes to the server as /result?{json}.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Talpy Chat bench</title>
  </head>
  <body style="margin: 0">
    <iframe id="f" src="/vscode/dev/chat.html?theme=dark&width=700&agents=0&tasks=0" style="width: 720px; height: 900px; border: 0"></iframe>
    <script>
      const f = document.getElementById("f");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let w, d;
      const frame = () => new Promise((r) => w.requestAnimationFrame(() => r(w.performance.now())));
      async function until(test, ms = 20000) {
        const end = performance.now() + ms;
        while (!test()) {
          if (performance.now() > end) throw new Error("timed out");
          await new Promise((r) => setTimeout(r, 0));
        }
      }
      const median = (xs) => { const s = xs.slice().sort((a, b) => a - b); return s.length ? Math.round(s[Math.floor(s.length / 2)] * 10) / 10 : null; };
      const shownKey = (items) => [...items].reverse().find((i) => i.kind === "you" || i.kind === "claude").key;

      // A conversation posted to an empty list: in the page and laid out ("layout"), then on
      // screen (the next frame after it, "paint"), in ms from the post
      async function show(answer) {
        w.postMessage({ type: "conversation", answer: { ok: true, items: [], more: false, stamp: "empty" + Math.random() } }, "*");
        await sleep(400);
        const key = shownKey(answer.items);
        const t0 = w.performance.now();
        w.postMessage({ type: "conversation", answer: { ...answer, stamp: "s" + Math.random() } }, "*");
        await until(() => d.querySelector(`[data-key="${CSS.escape(key)}"]`));
        void d.body.offsetHeight;
        const layout = w.performance.now() - t0;
        await frame();
        const paint = (await frame()) - t0;
        return { layout, paint };
      }

      // Scrolled 120 px a frame from the end to the top and back: each frame's time
      async function scroll() {
        const list = d.querySelector(".pane-list");
        list.scrollTop = list.scrollHeight;
        await sleep(500);
        const times = [];
        let last = await frame(), dir = -1;
        for (;;) {
          if (dir < 0 && list.scrollTop <= 0) dir = 1;
          else if (dir > 0 && list.scrollTop + list.clientHeight >= list.scrollHeight - 1) break;
          list.scrollTop += dir * 120;
          const t = await frame();
          times.push(t - last);
          last = t;
        }
        const s = times.slice().sort((a, b) => a - b), total = times.reduce((a, b) => a + b, 0);
        return { frames: times.length, height: list.scrollHeight, fps: Math.round(times.length * 10000 / total) / 10,
                 p50: Math.round(s[Math.floor(s.length / 2)]), p95: Math.round(s[Math.floor(s.length * 0.95)]),
                 max: Math.round(s[s.length - 1]), over20: times.filter((x) => x > 20).length, over34: times.filter((x) => x > 34).length };
      }

      // Enter in the reply box → your message in the list (a pending item), laid out and on screen
      async function send(i) {
        const box = d.querySelector(".pane-reply");
        box.focus();
        box.value = "Bench message " + i;
        box.dispatchEvent(new w.Event("input", { bubbles: true }));
        await sleep(300);
        const before = d.querySelectorAll('[data-key^="pending-"]').length;
        const t0 = w.performance.now();
        box.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
        await until(() => d.querySelectorAll('[data-key^="pending-"]').length > before, 5000);
        void d.body.offsetHeight;
        const layout = w.performance.now() - t0;
        await frame();
        return { layout, paint: (await frame()) - t0 };
      }

      // Search on the 500 items (Chat tab): a query typed, till the count says what it found, the
      // longest frame meanwhile; 20 steps (Enter), each till its frame; then Ctrl+O on the Steps tab
      // (every step's details made a few a frame), till they're all made. None in a build without it
      async function findBench(data) {
        w.postMessage({ type: "key", key: "find" }, "*");
        await sleep(400);
        const input = d.querySelector(".pane-find-text");
        if (!input) return { error: "no search in this build" };
        const count = () => d.querySelector(".pane-find-count")?.textContent ?? "";
        const out = {};
        for (const q of ["parser", "nowhere at all", "a"]) {
          const before = count();
          const gaps = [];
          let last = w.performance.now(), on = true;
          const tick = () => { if (!on) return; const t = w.performance.now(); gaps.push(t - last); last = t; w.requestAnimationFrame(tick); };
          w.requestAnimationFrame(tick);
          const t0 = w.performance.now();
          input.value = q;
          input.dispatchEvent(new w.Event("input", { bubbles: true }));
          await until(() => count() !== before && !count().includes("…"));
          const ms = w.performance.now() - t0;
          await frame();
          on = false;
          out["search " + JSON.stringify(q)] = { ms: Math.round(ms * 10) / 10, count: count(), maxFrame: Math.round(Math.max(...gaps)), over20: gaps.filter((g) => g > 20).length };
          await sleep(500);
        }
        input.value = "parser";
        input.dispatchEvent(new w.Event("input", { bubbles: true }));
        await until(() => /matches$/.test(count()));
        const steps = [];
        for (let i = 0; i < 20; i++) {
          const t0 = w.performance.now();
          input.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          await frame();
          steps.push((await frame()) - t0);
          await sleep(100);
        }
        out.steps = { median: median(steps), max: Math.round(Math.max(...steps)) };
        await show(data.folds);   // (Ctrl+O: every long text unfolded, on a chat of long replies and messages)
        await sleep(1000);
        const gaps = [];
        let last = w.performance.now(), on = true;
        const tick = () => { if (!on) return; const t = w.performance.now(); gaps.push(t - last); last = t; w.requestAnimationFrame(tick); };
        w.requestAnimationFrame(tick);
        const before = d.querySelectorAll(".pane-fold-more[aria-expanded=true]").length;
        const t0 = w.performance.now();
        w.postMessage({ type: "key", key: "fold" }, "*");
        await until(() => d.querySelectorAll(".pane-fold-more[aria-expanded=true]").length > before, 20000);
        void d.body.offsetHeight;
        const layout = w.performance.now() - t0;
        await frame();
        const paint = (await frame()) - t0;
        on = false;
        out.foldAll = { long: d.querySelectorAll(".pane-fold-more").length, layout: Math.round(layout), paint: Math.round(paint),
                        maxFrame: Math.round(Math.max(...gaps)) };
        const t1 = w.performance.now();
        w.postMessage({ type: "key", key: "fold" }, "*");
        await until(() => !d.querySelector(".pane-fold-more[aria-expanded=true]"), 20000);
        await frame();
        out.foldAll.back = Math.round((await frame()) - t1);
        return out;
      }

      // Bookmarks (6i), on the page loaded again: the 500-item chat with 100 of its messages bookmarked,
      // Claude's last reply the 100th (their ribbons: one <style> for the list): drawn and scrolled as
      // above; Ctrl+D on that last reply → its ribbon gone, then back, on screen; the list opened (first
      // time, then again); Alt+↑ to one; Enter → shown. In a build without bookmarks the toggles, the
      // list and the jumps aren't there: null
      function withMarks(answer, n, v) {
        const can = answer.items.filter((i) => (i.kind === "you" || i.kind === "claude") && !i.thinking && /^[A-Za-z0-9_.:@][A-Za-z0-9_.:@-]*$/.test(i.key));
        const last = [...can].reverse().find((i) => i.kind === "claude");
        const rest = can.filter((i) => i !== last);
        const k = Math.min(n - 1, rest.length);
        const pick = Array.from({ length: k }, (_, j) => rest[Math.floor(j * rest.length / k)]).concat(last ? [last] : []);
        const marks = pick.map((i, j) => ({ key: i.key, kind: i.kind, at: i.at || 0, text: String(i.text || "").replace(/\s+/g, " ").slice(0, 140), made: j }));
        return { ...answer, bookmarks: marks, bookmarksV: v };
      }
      async function reload() {
        const loaded = new Promise((r) => f.addEventListener("load", r, { once: true }));
        w.location.reload();
        await loaded;
        w = f.contentWindow;
        d = w.document;
        await until(() => d.querySelector(".pane-list .pane-item"));
        await sleep(1000);
      }
      async function bookmarksBench(data) {
        const out = {};
        await reload();
        const marked = withMarks(data.long500, 100, 1000);
        out.marks = marked.bookmarks.length;
        const runs = [];
        for (let r = 0; r < 3; r++) runs.push(await show({ ...marked, bookmarksV: 1000 + r }));
        out["render 500 + 100 bookmarks"] = { layout: median(runs.map((x) => x.layout)), paint: median(runs.map((x) => x.paint)) };
        await sleep(1000);
        out["scroll 500 + 100 bookmarks"] = await scroll();
        // Ctrl+D (at the end: Claude's last reply), till its gutter shows the ribbon; again, till it's gone
        const list = d.querySelector(".pane-list");
        list.scrollTop = list.scrollHeight;
        await sleep(500);
        const last = [...data.long500.items].reverse().find((i) => i.kind === "claude" && !i.thinking);
        const gutter = () => d.querySelector(`.pane-list > [data-key="${CSS.escape(last.key)}"] > .pane-gutter`);
        const ribbon = () => { const g = gutter(); if (!g) return false; const cs = w.getComputedStyle(g); return (cs.maskImage || cs.webkitMaskImage || "none") !== "none"; };
        const toggles = [];
        for (let r = 0; r < 6; r++) {
          const want = !ribbon();   // (off first: it's the 100th)
          const t0 = w.performance.now();
          w.postMessage({ type: "key", key: "bookmark" }, "*");
          try { await until(() => ribbon() === want, 2000); } catch { out.toggle = null; break; }
          const shown = w.performance.now() - t0;
          await frame();
          toggles.push({ shown, paint: (await frame()) - t0 });
          await sleep(400);
        }
        if (toggles.length) out.toggle = { runs: toggles.length, shown: median(toggles.map((x) => x.shown)), paint: median(toggles.map((x) => x.paint)) };
        // the list: opened (first time and again), drawn and on screen
        const opens = [];
        for (let r = 0; r < 6; r++) {
          const t0 = w.performance.now();
          w.postMessage({ type: "key", key: "bookmarks" }, "*");
          try { await until(() => d.querySelector(".pane-bookmarks .pane-bm, .pane-bookmarks-empty"), 2000); } catch { opens.length = 0; break; }
          void d.body.offsetHeight;
          const layout = w.performance.now() - t0;
          await frame();
          opens.push({ layout, paint: (await frame()) - t0 });
          await sleep(300);
          w.postMessage({ type: "key", key: "bookmarks" }, "*");
          await until(() => !d.querySelector(".pane-bookmarks"), 2000);
          await sleep(300);
        }
        out.listOpen = opens.length ? { first: Math.round(opens[0].paint * 10) / 10, again: median(opens.slice(1).map((x) => x.paint)),
                                         againLayout: median(opens.slice(1).map((x) => x.layout)) } : null;
        // Alt+↑ from the end, five times: each till the list has moved and the next frame
        list.scrollTop = list.scrollHeight;
        await sleep(500);
        const jumps = [];
        for (let r = 0; r < 5; r++) {
          const was = list.scrollTop;
          const t0 = w.performance.now();
          w.postMessage({ type: "key", key: "bookmarkUp" }, "*");
          try { await until(() => list.scrollTop !== was, 2000); } catch { break; }
          await frame();
          jumps.push((await frame()) - t0);
          await sleep(1000);
        }
        out.jump = jumps.length ? { runs: jumps.length, paint: median(jumps) } : null;
        // Enter → shown, with the 100 bookmarks there
        await show(withMarks(data.short, 10, 5000));
        await sleep(500);
        const sends = [];
        for (let i = 1; i <= 5; i++) {
          sends.push(await send(i));
          await sleep(800);
        }
        out["send with bookmarks"] = { layout: median(sends.map((x) => x.layout)), paint: median(sends.map((x) => x.paint)) };
        return out;
      }

      async function run() {
        w = f.contentWindow;
        d = w.document;
        const data = {};
        for (const k of ["short", "long", "long500", "folds"]) data[k] = await (await fetch(`/bench-data/${k}.json`)).json();
        await until(() => d.querySelector(".pane-list .pane-item"));
        await sleep(1000);
        const out = { ua: navigator.userAgent };
        for (const k of ["short", "long", "long500"]) {
          const runs = [];
          for (let r = 0; r < 3; r++) runs.push(await show(data[k]));
          out["render " + k] = { items: data[k].items.length, layout: median(runs.map((x) => x.layout)), paint: median(runs.map((x) => x.paint)) };
        }
        await show(data.long500);
        await sleep(1000);
        out["scroll 500, Chat tab"] = await scroll();
        await show(data.short);
        await sleep(500);
        const sends = [];
        for (let i = 1; i <= 5; i++) {
          sends.push(await send(i));
          await sleep(800);
        }
        out.send = { runs: sends.length, layout: median(sends.map((x) => x.layout)), paint: median(sends.map((x) => x.paint)) };
        await show(data.long500);
        await sleep(1000);
        out.find = await findBench(data);
        out.bookmarks = await bookmarksBench(data);
        await fetch("/result?" + encodeURIComponent(JSON.stringify(out)));
      }
      f.addEventListener("load", () => run().catch((e) => fetch("/result?" + encodeURIComponent(JSON.stringify({ error: String(e) })))), { once: true });
    </script>
  </body>
</html>
