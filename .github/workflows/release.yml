name: release

# Push a tag like v1.16.0 (the version in package/metadata.json,
# gnome/extension/metadata.json, vscode/package.json, CHANGELOG.md and
# vscode/CHANGELOG.md) and this builds the Plasma widget (.plasmoid), the GNOME
# extension (.zip) and the VS Code extension (.vsix) and publishes them as one
# GitHub release, with that version's CHANGELOG entries as its notes. For a tag
# that has no release yet, run it by hand (Actions → release → Run workflow)
# with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.16.0 (it must exist already)"
        required: true

env:
  # The tag: the one pushed, or the one typed in (passed through env, never
  # into the script itself)
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Two jobs: the build runs the packages and tests with a token that can only
# read; the publish job, the only one that can write, runs none of them and
# only publishes what the build made
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: A version tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          # no npm cache: what's published is built from the tag alone, not
          # from a cache an earlier run saved (setup-node's advice for
          # workflows that publish)
          package-manager-cache: false
      - name: The tag matches the versions
        run: |
          v="$VERSION"
          # fixed strings: in a pattern, the dots of 1.10 would match any character
          grep -qF "\"Version\": \"$v\"" package/metadata.json || { echo "package/metadata.json isn't $v"; exit 1; }
          grep -qF "\"version-name\": \"$v\"" gnome/extension/metadata.json || { echo "gnome/extension/metadata.json isn't $v"; exit 1; }
          [ "$(node -p "require('./vscode/package.json').version")" = "$v" ] || { echo "vscode/package.json isn't $v"; exit 1; }
          for log in CHANGELOG.md vscode/CHANGELOG.md; do
            awk -v head="## $v" '$0 == head || index($0, head " ") == 1 { found = 1 } END { exit !found }' "$log" \
              || { echo "$log has no $v entry"; exit 1; }
          done
      - name: Nothing private in the repository
        run: python3 tools/check_public.py --all --history
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: The VS Code extension's checks and tests
        working-directory: vscode
        run: |
          # (no install scripts: esbuild runs from its locked platform package,
          # and packing needs neither keytar nor vsce-sign)
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Build
        run: |
          mkdir dist
          (cd package && python3 -m zipfile -c "../dist/talpy-den-$VERSION.plasmoid" metadata.json contents)
          gnome/build.sh
          cp gnome/build/talpy-den@wzaielamri.github.io.shell-extension.zip dist/
          (cd vscode && npm run package)
          mv "vscode/talpy-den-$VERSION.vsix" dist/
          mkdir vsix
          unzip -q "dist/talpy-den-$VERSION.vsix" -d vsix
          python3 tools/check_public.py vsix
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Notes
        run: |
          # A CHANGELOG's entry for this version: the lines under its "## <version>" heading
          entry() { awk -v head="## $VERSION" '($0 == head || index($0, head " ") == 1) && !on { on = 1; next } /^## / && on { exit } on' "$1"; }
          # its "### Highlights" part, when it has one: the page shows only that,
          # with links to every change, so nobody scrolls through all of them
          highlights() { entry "$1" | awk '/^### Highlights$/ { on = 1; next } /^### / && on { exit } on'; }
          url="https://github.com/wzaielamri/talpy-den/blob/$TAG"
          if [ -n "$(highlights CHANGELOG.md | tr -d '[:space:]')" ]; then
            {
              echo "## Highlights"
              highlights CHANGELOG.md
              echo
              echo "**Every change:** [CHANGELOG.md]($url/CHANGELOG.md) (Plasma, GNOME and VS Code) and [vscode/CHANGELOG.md]($url/vscode/CHANGELOG.md) (VS Code's own list)."
            } > notes.md
          else
            {
              echo "## KDE Plasma and GNOME"
              entry CHANGELOG.md
              echo
              echo "## VS Code"
              entry vscode/CHANGELOG.md
            } > notes.md
          fi
          # GitHub takes up to 125,000 characters of notes (1.17.0 had 175,000).
          # Longer, the VS Code part becomes a link to its CHANGELOG (nearly all
          # of it is in the list above too), and longer still the list stops
          # after a whole entry, with a link to the rest. (Here, not in a file
          # of the repository: a release run by hand checks out an older tag.)
          python3 - notes.md "$TAG" <<'FIT'
          import sys
          path, tag = sys.argv[1], sys.argv[2]
          room = 120000  # (the install text after it is about 1,500 more)
          url = "https://github.com/wzaielamri/talpy-den/blob/" + tag
          text = open(path, encoding="utf-8").read()
          if len(text) > room:
              head = text.split("\n## VS Code\n", 1)[0].rstrip("\n")
              tail = "\n\n## VS Code\n\nIts changes are in [vscode/CHANGELOG.md](" + url + "/vscode/CHANGELOG.md).\n"
              if len(head) + len(tail) > room:
                  more = "\n\n… and more: the whole list is in [CHANGELOG.md](" + url + "/CHANGELOG.md)."
                  entries, kept = [], []
                  for line in head.split("\n"):
                      if line.startswith("- ") or not entries:
                          entries.append(line)
                      else:
                          entries[-1] += "\n" + line
                  for e in entries:
                      if len("\n".join(kept + [e])) + len(more) + len(tail) > room:
                          break
                      kept.append(e)
                  head = "\n".join(kept) + more
              text = head + tail
          open(path, "w", encoding="utf-8").write(text)
          FIT
          # (only this text is indented for the workflow file: the CHANGELOGs' own indents stay)
          sed 's/^          //' >> notes.md <<NOTES

          ## Install

          **KDE Plasma or GNOME, easiest:** download the source code below, unpack it and run \`./install.sh\`. It installs the Plasma widget or, in a GNOME session, the GNOME extension, and adds the status-line snippet that plan usage needs. On GNOME, log out and back in afterwards.

          **Only the widget:**
          - KDE Plasma 6: \`kpackagetool6 -t Plasma/Applet -i talpy-den-$VERSION.plasmoid\` (\`-u\` to update), then add *Talpy Den* to your panel.
          - GNOME Shell 49 or 50: \`gnome-extensions install --force talpy-den@wzaielamri.github.io.shell-extension.zip\`, log out and back in, then \`gnome-extensions enable talpy-den@wzaielamri.github.io\`.

          This way plan usage stays empty until you add \`statusline-snippet.sh\` to your status line (see the README).

          **VS Code:** download \`talpy-den-$VERSION.vsix\` below, then in VS Code open the Extensions view, **⋯** → **Install from VSIX…** (or run \`code --install-extension talpy-den-$VERSION.vsix\`). It needs Python 3.7+; [its README](https://github.com/wzaielamri/talpy-den/blob/$TAG/vscode/README.md) explains SSH hosts and the plan usage bars.
          NOTES
      - name: The release's files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: The release's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --title "Talpy Den ${TAG#v}" --notes-file notes.md --verify-tag
